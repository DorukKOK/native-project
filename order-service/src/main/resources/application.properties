spring.application.name=order-service

# native-project 8080'de çalışıyor; iki servis aynı anda açık olabilsin diye farklı port
server.port=8081

# product-service adresi (8080). Docker'da PRODUCT_SERVICE_URL=http://app:8080 ile ezilir.
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}

# Her servis kendi veritabanına sahip: order_db (native-project'in mydatabase'ine dokunmaz).
# Aynı Postgres container'ı (localhost:5433) kullanılır, değerler ortam değişkeniyle ezilebilir.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/order_db}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Sağlık kontrolü: GET /actuator/health
management.endpoints.web.exposure.include=health,info
