// Kök proje yalnızca eklenti sürümlerini tek yerde tutar. Her servis (product-service, order-service)
// kendi build.gradle'ında bu eklentileri sürümsüz uygular; derlenen, çalışan ve native exe üreten
// birimler servislerin kendisidir.
plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.hibernate.orm' version '7.4.10.Final' apply false
    id 'org.graalvm.buildtools.native' version '1.1.14' apply false
}
